[project]
name = "malvinas"
version = "0.1.0"
description = "From-scratch Mixture-of-Experts language model framework"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Alberto Ferrer", email = "albertof@barrahome.org" }]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "tokenizers>=0.23.1",
    "torch==2.10.0",
    "zstandard>=0.25.0",
]

[project.scripts]
malvinas-train = "malvinas.cli:main"
malvinas-benchmark-moe = "malvinas.benchmark_moe:main"
malvinas-generate = "malvinas.generate:main"
malvinas-evaluate = "malvinas.evaluate:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires access to external datasets or services",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
