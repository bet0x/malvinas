[project]
name = "malvinas"
version = "0.1.0"
description = "From-scratch Mixture-of-Experts language model framework"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Alberto Ferrer", email = "albertof@barrahome.org" }]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
